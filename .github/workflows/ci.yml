name: CI - Testar Migrações e Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-migrations-and-docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: nome_do_banco
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar Dependências do Back-end
        working-directory: ./backend
        run: npm ci

      - name: Executar Migrações do Prisma (Validar Estrutura)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://usuario:senha@localhost:5432/nome_do_banco?schema=public
        run: npx prisma migrate deploy

      - name: Construir Imagem Docker da Aplicação
        working-directory: ./backend
        run: docker build -t minha-api-node:${{ github.sha }} .